name: Generate Snake Animation

on:
  schedule:
    # Roda todos os dias às 03:00 UTC (meia-noite no horário de Brasília)
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game from a GitHub user contribution grid
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Kawasanchezz
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232563eb&color_dots=%23000000,%230d419d,%231158c7,%23388bfd,%2358a6ff

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
